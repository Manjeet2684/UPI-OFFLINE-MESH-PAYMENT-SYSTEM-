server.port=8080

# Default: in-memory H2 so `mvn test` and `mvn spring-boot:run` work without Docker.
spring.datasource.url=jdbc:h2:mem:upimesh;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.path=/h2-console
spring.h2.console.enabled=${UPI_H2_CONSOLE:true}

logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# Offline packets older than this are rejected as stale (replay window) and dropped from the mesh.
upi.mesh.packet-max-age-seconds=86400

# Empty = local demo (dashboard flush is in-process and does not use this).
# Set a value before exposing /api/bridge/ingest on a public host.
upi.bridge.ingest-token=

spring.codec.max-in-memory-size=256KB
server.tomcat.max-http-form-post-size=256KB
server.tomcat.max-swallow-size=262144
