# Use: --spring.profiles.active=postgres  (requires a running Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/upimesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:upi}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:upi}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
