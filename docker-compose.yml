services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: upimesh
      POSTGRES_USER: upi
      POSTGRES_PASSWORD: upi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upi -d upimesh"]
      interval: 5s
      timeout: 5s
      retries: 10
